[package]
name = "common"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Core library for the wftui WindowsForum terminal client: OAuth login, API client, throttling, BBCode rendering"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip", "brotli", "multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
base64ct = { version = "1", features = ["alloc"] }
rand = "0.8"
async-trait = "0.1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "signal", "test-util"] }
