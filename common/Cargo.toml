[package]
name = "common"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
description = "Core library for Forum Terminal (TUI) (wftui): OAuth login, API client, throttling, BBCode rendering"

[features]
default = ["builtin-windowsforum"]
# The Forum Terminal (TUI) edition: windowsforum.com is the site the client
# uses when no config file names one, and its logo/name are compiled in.
# Without it the same code is "Terminal for XenForo": no site until the
# first run's Setup screen (or config.json) names one.
builtin-windowsforum = []

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "signal"] }
# reqwest 0.13 renamed the TLS features and split `form`/`query` out of the
# always-on core. Its plain `rustls` feature now hard-wires the **aws-lc-rs**
# provider, which vendors a ~70 MB AWS-LC C source tree and needs a C toolchain
# (plus NASM on windows-msvc, since aws-lc-rs's `prebuilt-nasm` is opt-in) —
# that would break the "native `cargo build --release`, no C library" Windows
# story. `rustls-no-provider` keeps rustls and the platform certificate
# verifier but leaves the crypto provider to us, so we install *ring* (the
# provider reqwest 0.12's `rustls-tls` used) in `http::build`. Root store note:
# 0.12's `rustls-tls` bundled the webpki roots; 0.13 always uses
# `rustls-platform-verifier`, i.e. the OS trust store.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "brotli", "multipart", "json", "form", "query"] }
# Direct dependency only to pick the crypto provider; must stay in lockstep
# with the rustls reqwest resolves (`cargo tree -i rustls` shows one version).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
base64ct = { version = "1", features = ["alloc"] }
rand = "0.10"
async-trait = "0.1"
fs2 = "0.4"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "signal", "test-util"] }
