name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WFTUI_NO_UPDATE: "1"

jobs:
  test:
    name: Test / Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.99.1
          components: clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test

      - name: Clippy (default features)
        run: cargo clippy --all-targets --release -- -D warnings

      - name: Clippy (no-images)
        run: cargo clippy -p wftui --no-default-features --all-targets --release -- -D warnings

      - name: Clippy (Terminal for XenForo)
        run: cargo clippy -p wftui --no-default-features --features images --all-targets --release -- -D warnings

      - name: Test
        env:
          WFTUI_CONFIG_DIR: /tmp/wftui-test
        run: cargo test --workspace

      - name: Test (no-images)
        env:
          WFTUI_CONFIG_DIR: /tmp/wftui-test-no-images
        run: cargo test -p wftui --no-default-features

      - name: Test (Terminal for XenForo)
        env:
          WFTUI_CONFIG_DIR: /tmp/wftui-test-generic
        run: |
          cargo test -p common --no-default-features
          cargo test -p wftui --no-default-features --features images

      - name: Packaging output paths
        run: bash packaging/tests/build-tarball-smoke.sh

      # The TuiLink add-on's own tests: stubbed XenForo, in-memory SQLite.
      # No `-n` here: the runner's PHP loads pdo_sqlite from its ini.
      - name: TuiLink add-on
        run: php addon/tests/tuilink_test.php

      - name: No embedded escapes
        run: /usr/bin/grep -rn $'\x1b' wftui/src && exit 1 || exit 0
