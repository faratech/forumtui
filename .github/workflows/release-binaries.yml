name: Release Binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign only (no GitHub Release)'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux-tarball:
    name: Build Linux Tarball
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          persist-credentials: false

      - name: Extract version from tag or use dev version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building wftui $VERSION"

      # The self-updater names its asset after the *tag* but compares the
      # *binary's* Cargo version against it: a tag that does not match
      # wftui/Cargo.toml would publish a release that re-downloads itself
      # forever. Refuse it here, before anything is built.
      - name: Check the tag matches wftui/Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CRATE="$(grep -m1 '^version = ' wftui/Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          COMMON="$(grep -m1 '^version = ' common/Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [[ "$TAG" != "$CRATE" ]]; then
            echo "tag v$TAG does not match wftui/Cargo.toml version $CRATE" >&2
            exit 1
          fi
          if [[ "$COMMON" != "$CRATE" ]]; then
            echo "common/Cargo.toml ($COMMON) and wftui/Cargo.toml ($CRATE) versions differ" >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-linux

      - name: Build release tarball (default features)
        run: packaging/linux/build-tarball.sh

      - name: Build release tarball (no-images)
        run: packaging/linux/build-tarball.sh --no-images

      - name: Build release tarball (Terminal for XenForo)
        run: packaging/linux/build-tarball.sh --generic

      - name: Generate artifact attestation (Linux)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        continue-on-error: true
        with:
          subject-path: |
            dist/*.tar.gz
            dist/wftui-*-linux-x86_64
            dist/wftui-*-linux-aarch64
            dist/wftui-xf-*-linux-x86_64
            dist/wftui-xf-*-linux-aarch64

      - name: Upload tarballs and bare binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-tarballs
          path: |
            dist/*.tar.gz
            dist/wftui-*-linux-x86_64
            dist/wftui-*-linux-aarch64
            dist/wftui-xf-*-linux-x86_64
            dist/wftui-xf-*-linux-aarch64
          if-no-files-found: error

  build-windows-msix:
    name: Build Windows MSIX
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.msix_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          persist-credentials: false

      - name: Extract version from tag or use dev version
        id: version
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $VERSION = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
          } else {
            # MSIX requires numeric version components, including on dry runs.
            $manifest = Get-Content 'wftui/Cargo.toml' -Raw
            if ($manifest -notmatch '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"') {
              throw 'Could not read a numeric package version from wftui/Cargo.toml'
            }
            $VERSION = $Matches[1]
          }
          $MSIX_VERSION = "$VERSION.0"
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "msix_version=$MSIX_VERSION" >> $env:GITHUB_OUTPUT
          Write-Host "Building wftui $VERSION (MSIX: $MSIX_VERSION)"
        shell: pwsh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-windows

      - name: Restore Trusted Signing dlib
        run: packaging/msix/signing/install-dlib.ps1
        shell: pwsh

      - name: Dual-sign executables and sign MSIX packages
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          packaging/msix/build-msix.ps1 `
              -Version '${{ steps.version.outputs.version }}' `
              -OutDir 'dist'
        shell: pwsh

      - name: Generate artifact attestation (Windows)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        continue-on-error: true
        with:
          subject-path: |
            dist/*.msix
            dist/*.msixbundle
            dist/*.exe

      - name: Upload MSIX packages and bare executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-msix
          path: |
            dist/*.msix
            dist/*.msixbundle
            dist/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-linux-tarball, build-windows-msix]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    timeout-minutes: 10
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7
        with:
          name: linux-tarballs
          path: artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7
        with:
          name: windows-msix
          path: artifacts

      # One checksum file for every asset, in `sha256sum` format
      # (`<hex>  <name>`, two spaces). The client's self-updater downloads
      # SHA256SUMS.txt by that exact name and refuses a binary whose digest
      # is not in it, so it is recomputed here over what is actually being
      # published rather than merged from the per-job files.
      - name: Write SHA256SUMS.txt
        run: |
          cd artifacts
          rm -f -- *.sha256 *.SHA256SUMS.txt
          sha256sum wftui-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: wftui ${{ needs.build-linux-tarball.outputs.version }}
          body: |
            Forum Terminal (TUI) (wftui) — release ${{ needs.build-linux-tarball.outputs.version }}

            **Linux**
            - `wftui-*-linux-x86_64.tar.gz` — native binary + README (requires default features)
            - `wftui-*-linux-x86_64-no-images.tar.gz` — text-only tier (no graphics)
            - `wftui-*-linux-x86_64` — the bare binary (what a running wftui fetches to update itself)

            **Terminal for XenForo** (the same client with no built-in site — connects to any XenForo 2.3 forum)
            - `wftui-xf-*-linux-x86_64.tar.gz` — tarball
            - `wftui-xf-*-linux-x86_64` — the bare binary its self-updater fetches

            **Windows**
            - `wftui-*.msixbundle` — signed, installable on x64/x86/arm64 (recommended)
            - `wftui-*-x64.msix`, `wftui-*-x86.msix`, `wftui-*-arm64.msix` — per-architecture
            - `wftui-*-windows-{x64,x86,arm64}.exe` — the bare dual-signed executables (self-update)

            `SHA256SUMS.txt` covers every asset above; a running wftui verifies its own update against it.

            Proprietary software — in development.
          files: artifacts/*
          draft: false
          prerelease: false
